<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Reservas & Escape Room | Tymon's Family Diner</title>
    <style>
        body {
            background-color: #0b090e;
            color: #f1f1f1;

            margin: 0;
        }
        header {
            background: linear-gradient(135deg, #1a0b12 0%, #3d0814 100%);
            border-bottom: 3px solid #ffb703;
            padding: 25px;
        }
        h1 { color: #ffb703; text-transform: uppercase; }
        .box {
            max-width: 600px;
            margin: 50px auto;
            background: #16131d;
            border: 2px solid #e6192e;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 0 25px rgba(230, 25, 46, 0.3);
        }
        p { color: #ccc; font-size: 1.1rem; margin-bottom: 30px; }
        nav a {
            display: inline-block;
            margin: 10px;
            padding: 12px 24px;
            background-color: #ffb703;
            color: #0b090e;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }
        nav a:hover {

            color: #fff;
